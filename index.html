<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wollongong Salvo Band</title>
<meta name="theme-color" content="#191d28" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salvo Band">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* v2 layout: in-flow header, three views (This week, My dates, Announcements) switched by a fixed bottom tab bar. Large type for older eyes, rem-based so the Text size setting scales everything. */
:root{--fs:17px;--bg:#f1f3f7;--surface:#ffffff;--ink:#0f1629;--muted:#36415c;--line:#cfd5e1;--line-strong:#9aa3b8;--navy:#22305a;--on-navy:#ffffff;--brass:#8f620f;--on-brass:#ffffff;--brass-soft:#f4e8cf;--ok:#17673a;--ok-soft:#dcf1e3;--bad:#a8231b;--bad-soft:#fbe1de;--wait:#6e4a00;--wait-soft:#fdefc3;--focus:#1f5fd6;--scrim:rgba(8,12,22,.55);--off:#e4e6eb;--off-ink:#3f4757;--ev:#5b3a9e;--ev-soft:#ece5f8;--off-line:#a9b0bd;
--f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151f;--surface:#1b2130;--ink:#f1f3f8;--muted:#c2cadb;--line:#363f55;--line-strong:#59637c;--navy:#aebde9;--on-navy:#11151f;--brass:#e3b45c;--on-brass:#1b1406;--brass-soft:#3a2f18;--ok:#86d8a6;--ok-soft:#173424;--bad:#f39a90;--bad-soft:#3d1d1a;--wait:#f2cf6a;--wait-soft:#3a3014;--focus:#8db4ff;--scrim:rgba(0,0,0,.65);--off:#2a2f3b;--off-ink:#c2cadb;--ev:#c7b2f0;--ev-soft:#2c2342;--off-line:#59637c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151f;--surface:#1b2130;--ink:#f1f3f8;--muted:#c2cadb;--line:#363f55;--line-strong:#59637c;--navy:#aebde9;--on-navy:#11151f;--brass:#e3b45c;--on-brass:#1b1406;--brass-soft:#3a2f18;--ok:#86d8a6;--ok-soft:#173424;--bad:#f39a90;--bad-soft:#3d1d1a;--wait:#f2cf6a;--wait-soft:#3a3014;--focus:#8db4ff;--scrim:rgba(0,0,0,.65);--off:#2a2f3b;--off-ink:#c2cadb;--ev:#c7b2f0;--ev-soft:#2c2342;--off-line:#59637c;color-scheme:dark}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;scrollbar-gutter:stable}   /* same width on every tab, scrollbar or not, so the tab bar doesn't shift */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 var(--f-body);margin:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh;min-height:100dvh}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.small{font-size:.9rem}.muted{color:var(--muted)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.05rem var(--f-body);cursor:pointer;text-align:center;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.send,.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.primary,.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;position:relative;z-index:13}
@media (display-mode:standalone){html{background:var(--surface)}.hdr{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}}
.hdr-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:800 19px/1.15 var(--f-body);white-space:nowrap}
.brand span{font-size:13.5px;line-height:1.3;color:var(--muted)}
.brand span.stale{color:var(--wait);font-weight:700}
.updbar{background:var(--brass-soft);border-bottom:1px solid var(--line);padding:12px 16px}
.updin{max-width:680px;margin:0 auto;display:grid;gap:10px}
.updin b{display:block;font:800 1.1rem/1.2 var(--f-body);color:var(--brass)}
.updin span{display:block;color:var(--ink)}
ul.ticks.prefs input{accent-color:var(--navy)}
ul.ticks input:disabled+.tk{opacity:.5}
.hbtns{display:flex;gap:8px;flex:none}
.ib{appearance:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:800 17px var(--f-body);text-decoration:none;flex:none;-webkit-tap-highlight-color:transparent}
.ib svg{width:24px;height:24px}
.ib:disabled{opacity:.35;cursor:default}
/* views */
.wrap{max-width:680px;margin:0 auto;padding:10px 16px 28px;display:grid;gap:14px}
#noteTop:empty{display:none}   /* no gap above This week when there's no new announcement */
.wrap>*{min-width:0}
h1.pg{margin:0;font:800 1.6rem/1.15 var(--f-body)}
.sec{font-weight:700;color:var(--muted);margin-top:4px}
.month{font:800 1.15rem var(--f-body);margin-top:6px}
/* notes */
details.fold{border:2px solid var(--line);border-radius:14px;background:var(--bg)}
details.fold summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:800;font-size:1.05rem;-webkit-tap-highlight-color:transparent}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"\25B6";color:var(--brass);font-size:.85rem}
details.fold[open] summary::before{content:"\25BC"}
details.fold .fb{padding:0 14px 14px}
details.fold .upd{display:block;font-weight:400;font-size:.92rem;color:var(--muted)}
details.fold .bmw{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem}
details.fold .bmw.h{white-space:normal}details.fold .bmw p{margin:0 0 .8em}details.fold .bmw p:last-child{margin-bottom:0}
.dvban{appearance:none;width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;background:color-mix(in srgb,var(--navy) 10%,var(--bg));border:0;border-left:4px solid var(--navy);border-radius:4px 10px 10px 4px;padding:10px 12px;font:600 1rem/1.35 var(--f-body);color:var(--ink);cursor:default;-webkit-tap-highlight-color:transparent}
.dvban .ico{width:20px;height:20px;flex:none;margin-top:1px;color:var(--navy)}.dvban>span:not(.chev){flex:1;min-width:0}
button.dvban{cursor:pointer}
.dvban small{display:block;font-weight:400;color:var(--muted)}.dvban .chev{font-size:1.3rem;line-height:1;color:var(--muted);align-self:center}
.dvban.none{color:var(--muted)}
article.dc.hl{outline:4px solid var(--brass);outline-offset:2px}
.dvst{margin-top:4px;font-size:.92rem}.pill{display:inline-block;font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--off);color:var(--off-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.wait{background:var(--wait-soft);color:var(--wait)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dvrow small.hist{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.msg .ask{background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:700}
.msg .mine{border-left:4px solid var(--navy);background:var(--surface);border-radius:8px;padding:8px 12px}
.msg .mine small{display:block;color:var(--muted)}
.rform{display:grid;gap:10px}.orline{text-align:center;color:var(--muted);font-weight:700;margin:2px 0}.ropts{display:grid;gap:8px}
.ropt{appearance:none;min-height:56px;border-radius:14px;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);font:700 1.05rem var(--f-body);text-align:left;padding:10px 16px;cursor:pointer}
.ropt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.ropt[aria-pressed="true"]::before{content:"\2713  "}
.rtext{width:100%;min-height:96px;font:inherit;border:2px solid var(--line-strong);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink)}
.msg .sub{margin:0;color:var(--muted)}
.msg{background:var(--brass-soft);border:2px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:16px;padding:14px;display:grid;gap:10px}
.msg.read{background:var(--surface);border-color:var(--line)}
.msg .from{font-weight:700;color:var(--brass);font-size:.92rem}
.msg.read .from{color:var(--muted)}
.msg .nt{font-size:1.05rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .nt a{color:var(--navy)}
.msg .nt .fpp{font-size:1.2rem}
.more{font-size:.92rem;color:var(--muted)}
/* date card */
.dc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;min-width:0}
/* grid children shrink to the phone's width: a long word or link in a card wraps instead of widening the whole list */
.dc>*{min-width:0}
.dh{display:grid;gap:2px}
.dd{font:800 1.3rem/1.15 var(--f-body)}
.dk{color:var(--muted)}
.ev{color:var(--brass);font-weight:700}
/* an extra band event (carolling on a Thursday, a Sunday evening concert): purple border and an Extra event tag */
.dc.evc{border:2px solid var(--ev)}
.evtag{justify-self:start;font:800 .85rem/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--ev);background:var(--ev-soft);padding:4px 10px;border-radius:8px}
.evt{font:800 1.3rem/1.15 var(--f-body)}
.evt,.dc .dk{overflow-wrap:anywhere}
.evn{background:var(--ev-soft);border-radius:10px;padding:8px 12px;overflow-wrap:anywhere}
.evn a{color:var(--navy)}
.st{display:flex;align-items:center;gap:10px;font-weight:700;padding:10px 12px;border-radius:12px}
.st svg{width:24px;height:24px;flex:none}
.st small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.st.in{background:var(--ok-soft);color:var(--ok)}
.st.away{background:var(--bad-soft);color:var(--bad)}
.st.awaysent,.st.insent{background:var(--wait-soft);color:var(--wait)}
.st.usual{background:var(--bg);color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{min-height:58px;padding:8px 6px;font-size:1rem}
.pair .btn.yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pair .btn.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.vis{border-left:4px solid var(--navy);padding:2px 0 2px 10px}.vis ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px}
.dc.off{background:var(--off);border:2px dashed var(--off-line)}.dc.off .dd{color:var(--off-ink)}
.offst{font:800 1.1rem/1.25 var(--f-body);color:var(--off-ink);padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--off-ink) 12%,transparent)}
.offst small{display:block;font:400 .95rem var(--f-body)}
.grid7 button.d.d.off{background:var(--off);color:var(--off-ink);border:2px dashed var(--off-line);align-content:center;line-height:1.05}
.grid7 button.d.d.off small{display:block;font:800 .58rem var(--f-body);text-transform:uppercase;letter-spacing:.02em}
.dvrow.off{background:var(--off);color:var(--off-ink);border-left:5px solid var(--off-line);border-radius:8px;padding-left:10px;padding-right:6px}.dvrow.off small{color:var(--off-ink);font-weight:700}
.dvlist{display:grid}.dvrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dvrow:last-child{border-bottom:0}.dvrow b{display:block;font-size:1.05rem}.dvrow small{color:var(--muted);font-size:.95rem}.dvrow small.no{color:var(--bad);font-weight:700}.dvrow .btn{min-height:48px}
.srch{display:flex;align-items:center;gap:8px;min-height:56px;border:2px solid var(--navy);border-radius:14px;padding:0 6px 0 12px;background:var(--surface)}
.srch svg{width:22px;height:22px;color:var(--muted)}.srch input{flex:1;min-width:0;border:0;background:none;font:400 1.1rem var(--f-body);color:var(--ink);outline:none;min-height:50px}
.srch button{appearance:none;width:44px;height:44px;border-radius:10px;border:0;background:var(--bg);color:var(--muted);font-size:1rem;cursor:pointer}
.dvopts{display:grid;gap:8px;max-height:46vh;overflow-y:auto}
.dvopt{appearance:none;min-height:54px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font:700 1.05rem var(--f-body);color:var(--ink);background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;cursor:pointer}
.dvbar{position:sticky;top:0;z-index:2;margin:-20px -16px 0;padding:20px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dvbar .btn{min-height:60px;font-size:1.15rem}
.dvfoot{position:sticky;bottom:-24px;z-index:2;margin-bottom:-24px;padding:10px 0 24px;background:var(--bg);border-top:1px solid var(--line)}
.dvfoot .btn{width:100%;min-height:60px;font-size:1.15rem}
/* v5.6: the Devotions roster's Done stays at the top while the dates scroll */
.dvtop{position:sticky;top:0;z-index:2;margin:-20px -16px 0;padding:20px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.dvtop .btn{min-height:60px;min-width:120px;font-size:1.15rem}
.dvpick{font-weight:700}
.dvopt small{font-weight:400;color:var(--bad);font-size:.9rem}.dvopt.alt{font-weight:400;border-style:dashed}
.dvopt[aria-pressed="true"]{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 14%,var(--surface))}
.pinin{font:800 2rem var(--f-body)!important;letter-spacing:.5em;text-align:center}
.err{color:var(--bad);font-weight:700}
.okm{margin:0;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700}
.who{color:var(--muted)}
.who b{color:var(--ink)}
ol.mus{margin:0;padding-left:1.4em;display:grid;gap:8px}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mrow>div{min-width:0}
.mrow b{font-weight:700}
.mrow .mi{display:block;color:var(--muted);font-size:.88rem}
.mrow .tag{color:var(--brass);font-weight:700;font-size:.85rem}
.recb{appearance:none;flex:none;display:inline-flex;align-items:center;gap:5px;min-height:46px;padding:0 14px;border-radius:999px;border:2px solid var(--brass);background:var(--surface);color:var(--brass);font:700 .9rem var(--f-body);cursor:pointer}
.recb svg{width:18px;height:18px}
/* View music (v4.4): the piece's buttons sit under its title, so long titles keep the full width */
ol.mus .mrow{display:grid;gap:8px;justify-content:stretch}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.musb{appearance:none;flex:none;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--brass);background:var(--brass);color:var(--on-brass);font:700 .95rem var(--f-body);cursor:pointer;-webkit-tap-highlight-color:transparent}
.musb svg{width:18px;height:18px}
ol.mp li.band .musb{margin-top:8px}
/* v5.6: Words, in big print, for any piece the Bandmaster has words for */
.wdb{appearance:none;flex:none;display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--brass);background:var(--surface);color:var(--ink);font:700 .95rem var(--f-body);cursor:pointer;-webkit-tap-highlight-color:transparent}
ol.mp li.band .mbtns{margin-top:8px}ol.mp li.band .mbtns .musb{margin-top:0}
.wds{font-size:1.3rem;line-height:1.5;overflow-wrap:anywhere}.wds p{margin:0 0 1em}.wds p:last-child{margin-bottom:0}
/* the music, full screen: the piece and the player's part at the top, one big Close */
.mv{position:fixed;inset:0;z-index:30;background:var(--surface);display:flex;flex-direction:column}
.mvh{display:flex;align-items:flex-start;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;border-bottom:1px solid var(--line)}
.mvh>div{flex:1;min-width:0}
.mvh b{display:block;font:800 1.2rem/1.2 var(--f-body);overflow-wrap:anywhere}
.mvh span{display:block;color:var(--muted)}
.mvh .yp{color:var(--ok);font-weight:700}
.mvh .mvacts{display:flex;gap:8px;flex:none}
.mvh .mvpr{width:56px;padding:0}.mvh .mvpr svg{width:28px;height:28px}
.mvb{flex:1;overflow:auto;background:#fff;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.mvb img{display:block;width:100%;height:auto}
.mvb .mvm{color:#36415c;text-align:center;padding:40px 10px;font-weight:700}
.mvn{background:#f6ecd8;border-left:6px solid #a8741c;color:#18213a;padding:10px 14px;font-size:1.3rem;font-weight:800;line-height:1.3}
.mvn small{display:block;font-size:1.05rem;font-weight:600;color:#36415c}
.mvn[hidden]{display:none}
.mvb .mvm.err{color:#a8231b}
/* Meeting Plan: the whole order of service, the band's items in gold */
ol.mp{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.mp li{padding:10px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
ol.mp li.band{background:var(--brass-soft);border-left:6px solid var(--brass);font-weight:700}
ol.mp .mpwh{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
ol.mp .mpw{display:block;font-weight:400;color:var(--muted)}
ol.mp .mpd{font-weight:400;margin-top:3px;white-space:pre-line}
/* my dates */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;color:var(--muted);min-height:48px;padding:0 12px;font:700 .92rem var(--f-body);display:flex;align-items:center;gap:6px;cursor:pointer}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.cal .ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal .ch b{font:800 1.15rem var(--f-body)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.grid7 .dow{font-size:.8rem;font-weight:700;color:var(--muted)}
.grid7 .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-weight:700;color:var(--muted);font-size:.95rem;min-width:0}
.grid7 button.d{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0;width:100%;font:800 1rem var(--f-body)}
.grid7 button.d.in{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.grid7 button.d.away{background:var(--bad);color:var(--surface);border-color:transparent}
.grid7 button.d.usual{background:var(--bg);color:var(--muted);border-style:dotted}
.grid7 button.d.awaysent,.grid7 button.d.insent{background:var(--wait-soft);color:var(--wait);border:2px dashed var(--wait)}
.grid7 button.d.sel{outline:3px solid var(--navy);outline-offset:1px}
/* past dates (calendar only): grey, read-only */
.grid7 button.d.past{background:var(--off);color:var(--off-ink);border-color:var(--line)}
.dc.past{background:var(--off);border:2px solid var(--line)}
.dc.past details.fold{background:var(--surface)}
.ptag{justify-self:start;font:800 .8rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;margin-top:4px}

const evKey=e=>e.date+"|"+String(e.title||"").toLowerCase();
const evAll=()=>{const own=D.events||[],seen=new Set(own.map(evKey));
  return own.concat((D.cal||[]).filter(e=>e&&e.date&&e.title&&!seen.has(evKey(e))).map(e=>({date:e.date,end:e.endDate||e.date,title:e.title,time:e.time||""})))};
const evOn=s=>evAll().filter(e=>s>=e.date&&s<=e.end);
// Extra band events: D.extra (coming up) and D.past.extra, each {k: key, d: date, t: title, s and e: start and end "18:30",
// pl: place, n: note, list: music}, with each member's xcells and pxcells. mergeX() puts them in among the Wednesdays and
// Sundays (D.sessions, cells, and D.past.sessions, pcells), in date and time order, so every list works the same for them.
// Done again each time new data comes in (it leaves data it already merged alone).
const xOf=s=>s.length>10?((D.extra||[]).find(x=>x.k===s)||((D.past||{}).extra||[]).find(x=>x.k===s)||null):null;
function mergeX(){
  const mix=(S,X)=>{if(!X||!X.length||S.includes(X[0].k))return null;
    const at=s=>s.length>10?s.slice(0,10)+" "+((X.find(x=>x.k===s)||{}).s||"00:00"):s+" "+(P(s).getDay()===0?"10:00":"19:00");
    return S.map((s,i)=>({s,i})).concat(X.map((x,j)=>({s:x.k,j}))).sort((a,b)=>at(a.s)<at(b.s)?-1:at(a.s)>at(b.s)?1:0)};
  let o=mix(D.sessions,D.extra);
  if(o){D.members.forEach(m=>{const c=m.cells||[],x=m.xcells||[];m.cells=o.map(e=>e.i!=null?c[e.i]:(x[e.j]||""))});D.sessions=o.map(e=>e.s)}
  const PD=D.past;if(!PD)return;o=mix(PD.sessions||[],PD.extra);
  if(o){D.members.forEach(m=>{const c=m.pcells||[],x=m.pxcells||[];m.pcells=o.map(e=>e.i!=null?c[e.i]:(x[e.j]||""))});PD.sessions=o.map(e=>e.s)}}
mergeX();
// "6:30pm" from "18:30"; an event's times "6:30pm to 8pm"
const hm12=t=>t?(+t.slice(0,2)%12||12)+(t.slice(3)==="00"?"":":"+t.slice(3))+(+t.slice(0,2)<12?"am":"pm"):"";
const xWhen=x=>x&&x.s?hm12(x.s)+(x.e?" to "+hm12(x.e):""):"";
// a session is over once Sunday worship ends (1pm) or Wednesday practice ends (9pm), an extra event at its end time
// (2 hours after it starts with no end time, at midnight with no times)
const isPast=s=>{const d=P(s);
  if(kind(s)==="ev"){const x=xOf(s)||{},t=x.e||(x.s?String(Math.min(23,+x.s.slice(0,2)+2)).padStart(2,"0")+x.s.slice(2):"");if(t)d.setHours(+t.slice(0,2),+t.slice(3),0,0);else d.setDate(d.getDate()+1)}
  else d.setHours(kind(s)==="sun"?13:21,0,0,0);
  return Date.now()>=d.getTime()};
const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ICON={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  away:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>',
  usual:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>'

// ----- per-phone state -----

if(store.get("band.notesFrom",null)===null)store.set("band.notesFrom",who||Object.keys(store.get("band.noted",{})).length?"":new Date(Date.now()-600000).toISOString());   // 10 minutes of grace for a phone clock that runs fast
const notesFromPhone=store.get("band.notesFrom","");
// After the app is put on a phone again, the member's Noted taps kept centrally (D.notedBy, by the name they pick)

function hasNotedRecord(){const m=me();return !!m&&(Object.keys((D.notedBy||{})[m.id]||{}).length>0||Object.keys(window.__notedFor||{}).length>0)}
function notesFromFn(){return hasNotedRecord()?"":notesFromPhone}
if(!D.members.some(m=>m.id===who))who="";
let intents=store.get("band2.intents",{});   // {memberId:{date:{want:"in"|"away",at}}} sent, not yet shown on the roster
let queue=store.get("band2.queue",null);     // {mid,items:[{date,want,reason}],at} waiting out the Undo time
let fs=store.get("band2.fs",17);
// The app always opens on This week, with My dates as a list (also after more than 5 minutes away from the app)
let tab="week",dview="list",shown=10,calM=null,calSel=null,calPast=null;
document.documentElement.style.setProperty("--fs",fs+"px");
// carry over v1 "sent" markers so nothing looks lost after the update
(function migrate(){if(store.get("band2.migrated",false))return;
  const put=(src,want)=>{const o=store.get(src,{});for(const id in o)for(const s in o[id]){(intents[id]=intents[id]||{})[s]={want,at:Date.now()}}};
  put("band.sent","away");put("band.sentUnbacks","away");put("band.sentBacks","in");put("band.sentCancels","in");
  store.set("band2.intents",intents);store.set("band2.migrated",true)})();

const me=()=>D.members.find(x=>x.id===who);
const upcoming=()=>D.sessions.map((s,i)=>i).filter(i=>!isPast(D.sessions[i]));
// tidy intents the roster now reflects, or that are old or past.
// Runs at start AND every time fresh roster data arrives. The band's script shows a member's change on the roster within seconds,
// so once data fetched 2 minutes or more after a send has come in, the roster itself is the truth (even if the change was
// noted, rejected or undone from another device in between) and the "Sent" marker is dropped.
function tidy(){const now=Date.now(),got=+store.get("band.checked",0)||0;
  for(const id in intents){const m=D.members.find(x=>x.id===id);
    for(const s in intents[id]){const i=D.sessions.indexOf(s),it=intents[id][s],c=m&&i>=0?m.cells[i]:null;
      if(!m||i<0||isPast(s)||now-(it.at||0)>2*86400000||(got&&got-(it.at||0)>120000)||(it.want==="away"&&(c==="x"||c==="p"))||(it.want==="in"&&(c===""||c==="r")&&it.base!==c))delete intents[id][s]}
    if(!Object.keys(intents[id]).length)delete intents[id]}
  store.set("band2.intents",intents)}
tidy();

function queued(mid,s){return queue&&queue.mid===mid?queue.items.find(x=>x.date===s):null}
// what this member wants for a session, and how to show it
function eff(m,i){const s=D.sessions[i],c=m.cells[i],q=queued(m.id,s),it=(intents[m.id]||{})[s];
  const pend=q||it;const want=pend?pend.want:(["x","p","s"].includes(c)?"away":"in");
  let st;
  if(want==="away")st=(!pend&&c==="x")?"away":(!pend&&c==="s")?"usual":"awaysent";
  // taking back an away date the Bandmaster hasn't noted yet needs nothing from him, so it shows as In straight away
  else st=(!pend&&c==="")?"in":(pend&&["","p"].includes(pend.base!==undefined?pend.base:c))?"in":"insent";
  return {want,st}}
const ST={in:["You're In",""],away:["You're away",""],awaysent:["Away. Sent for Bandmaster","You'll see a red cross once it's noted"],insent:["You're In. Sent for Bandmaster","You'll see a green tick once it's noted"],usual:["Not usually on ",""]};
function statusHtml(m,i){const e=eff(m,i);let t=ST[e.st][0];if(e.st==="usual")t+=kind(D.sessions[i])==="sun"?"Sundays":"Wednesdays";
  const ic=e.st==="in"?ICON.in:e.st==="away"?ICON.away:e.st==="usual"?ICON.usual:ICON.sent;
  return '<div class="st '+e.st+'">'+ic+'<span>'+esc(t)+(ST[e.st][1]?'<small>'+ST[e.st][1]+'</small>':'')+'</span></div>'}
function pairHtml(m,i){const w=eff(m,i).want;
  return '<div class="pair"><button type="button" class="btn yes" data-set="in" data-i="'+i+'" aria-pressed="'+(w==="in")+'">I\'ll be there</button><button type="button" class="btn no" data-set="away" data-i="'+i+'" aria-pressed="'+(w==="away")+'">I\'m away</button></div>'}
const shortName=n=>{const w=String(n).trim().split(/\s+/);return w.length>1?w[0]+" "+w[w.length-1][0]:w[0]};
function awayHtml(m,i){const a=[];if(eff(m,i).want==="away")a.push("You");
  D.members.forEach(x=>{if(x.id!==m.id&&!x.test&&["x","p","s"].includes(x.cells[i]))a.push(shortName(x.name))});
  return '<div class="who"><b>Away:</b> '+(a.length?esc(a.join(", ")):"Nobody")+'</div>'}
const kindLabel=s=>kind(s)==="ev"?((xOf(s)||{}).t||"Band event")+(xWhen(xOf(s))?" · "+hm12(xOf(s).s):""):kind(s)==="sun"?"Sunday meeting":"Practice";
function evHtml(s){const ev=evOn(s);return ev.length?'<span class="ev">★ '+esc(ev.map(e=>e.title+(e.time?", "+e.time:"")).join(" · "))+'</span>':''}

// ----- music -----
let recs=[];
// View music: a piece's p is its music picture ID. The player's part on a date is the part the Bandmaster nominated for a
// flexible player (D.alloc), else their own part. D.pics lists the parts with a picture, so a player only gets a View
// button for their own part, and api=music only sends that part. Only in the band app (the Apps Script sends the picture).
const partOn=(m,s)=>((D.alloc||{})[s]||{})[m.id]||m.part||"";
function viewBtn(p,s,t,i){const m=me();if(!p||!m||!window.__bandApi||!((D.pics||{})[p]||[]).includes(partOn(m,s)))return "";
  return '<button type="button" class="musb" data-mv="'+esc(p)+'" data-s="'+s+'" data-t="'+esc(t)+'" data-i="'+esc(i||"")+'" aria-label="View your music for '+esc(t)+'">'+ICON.note+'View</button>'}
// on a past date, poSun is the Sunday a play-out was planned for, so its label names the date. s = the date (for the part)
// Words (v5.6): wk = the key of the piece's Words in D.words, opened in big print
function wordsBtn(wk,t){return wk&&(D.words||{})[wk]?'<button type="button" class="wdb" data-wk="'+esc(wk)+'" data-t="'+esc(t)+'" aria-label="Words of '+esc(t)+'">Words</button>':""}
function openWords(b){const h=(D.words||{})[b.dataset.wk];if(!h)return;
  openSheet('<div class="dvtop"><h2>'+esc(b.dataset.t)+'</h2><button type="button" class="btn navy" data-close>Done</button></div><div class="wds">'+h+'</div>',"words")}
function musicHtml(list,none,poSun,s){if(!list.length)return '<p class="muted">'+(none||"Not set yet")+'</p>';
  return '<ol class="mus">'+list.map(r=>{let btn=wordsBtn(r.wk,r.t)+viewBtn(r.p,s,r.t,r.i);if(r.l){btn+='<button type="button" class="recb" data-rec="'+recs.length+'" aria-label="Listen to '+esc(r.t)+'">'+ICON.play+'Listen</button>';recs.push(r)}
    const tag=r.cat?r.cat:r.po?r.po+(poSun?" "+fmt(poSun,true):" this Sunday"):"";
    return '<li><div class="mrow"><div><b>'+esc(r.t)+'</b>'+(tag?' <span class="tag">'+esc(tag)+'</span>':'')+(r.i?'<span class="mi">'+esc(r.i)+'</span>':'')+'</div>'+(btn?'<div class="mbtns">'+btn+'</div>':'')+'</div></li>'}).join("")+'</ol>'}
// Meeting Plan (only when the Bandmaster made that Sunday's music visible): wh "b" before / "a" after the service, b = a band item,
// p = the picture of the Sunday piece it is (its View button names the piece from the Sunday list), l = the recording of the
// piece flagged to play out that Sunday that it is (v6.1: Listen, the same player as the Sunday list's)
function mpHtml(L,s,list){return '<ol class="mp">'+L.map(r=>{const pc=(r.p&&(list||[]).find(x=>x.p===r.p))||(r.l&&(list||[]).find(x=>x.l===r.l)),nm=pc?pc.t:r.t;
  let lb="";if(r.b&&r.l){lb='<button type="button" class="recb" data-rec="'+recs.length+'" aria-label="Listen to '+esc(nm)+'">'+ICON.play+'Listen</button>';recs.push({t:nm,l:r.l})}
  return '<li'+(r.b?' class="band"':'')+'>'+(r.wh==="b"?'<span class="mpwh">Before the service</span>':r.wh==="a"?'<span class="mpwh">After the service</span>':'')
  +esc(r.t)+(r.w?'<span class="mpw">'+esc(r.w)+'</span>':'')+(r.d?'<div class="mpd">'+esc(r.d)+'</div>':'')+(r.c?'<div class="mpd">'+esc(r.c)+'</div>':'')
  +(r.b?mpBtns(wordsBtn(r.wk,nm)+viewBtn(r.p,s,nm,pc?pc.i:"")+lb):"")+'</li>'}).join("")+'</ol>'}
const mpBtns=b=>b?'<div class="mbtns">'+b+'</div>':"";
// "Tue 20 Oct 3:15pm" from an ISO time, "" if it isn't one
function atText(t){const d=new Date(t);if(!t||isNaN(d))return "";const h=d.getHours();
  return fmt(iso(d),true)+" "+(h%12||12)+":"+String(d.getMinutes()).padStart(2,"0")+(h<12?"am":"pm")}
// mu = when the plan was last updated, on its own line under the heading

function devoWho(s,M){const w=(M.weds||[]).find(x=>x.d===s),dv=w&&(w.reh||[]).find(r=>r.devo);return dv?dv.i:((D.devo||{})[s]||{}).p||""}
function offOf(s){return (D.off||{})[s]||null}

// buttons, and its music (This week shows it, My dates has it closed until tapped)
function evCardHtml(m,i,full){const s=D.sessions[i],x=xOf(s)||{},L=x.list||[];
  let h='<article class="dc evc" data-s="'+s+'"><span class="evtag">★ Extra event</span><div class="dh"><span class="evt">'+esc(x.t||"Band event")+'</span><span class="dk"><b class="dd" style="font-size:1rem">'+fmt(s,true)+'</b>'+(xWhen(x)?' · '+esc(xWhen(x)):'')+(x.pl?'<br>'+esc(x.pl):'')+'</span></div>'
   +(x.n?'<div class="evn">'+linky(x.n)+'</div>':'')+statusHtml(m,i)+pairHtml(m,i);
  if(L.length)h+=full?'<div class="sec">Music</div>'+musicHtml(L,"",null,s):fold("mus-"+s,"Music",musicHtml(L,"",null,s));
  return h+awayHtml(m,i)+visHtml(s)+'</article>'}
function cardHtml(m,i,full){const s=D.sessions[i],k=kind(s),M=D.music||{},off=offOf(s);
  if(k==="ev")return evCardHtml(m,i,full);
  let h='<article class="dc'+(off?' off':'')+'" data-s="'+s+'"><div class="dh"><span class="dd">'+fmt(s,true)+'</span>'+(off?'':'<span class="dk">'+kindLabel(s)+'</span>')+evHtml(s)+'</div>'
   +(off?'<div class="offst">'+esc(off.l)+(off.n?'<small>'+esc(off.n)+'</small>':'')+'</div>':'')+statusHtml(m,i)+(off?'':pairHtml(m,i));
  if(full&&!off)h+=fullMusicHtml(s,M);

  if(!full&&!off&&k==="wed")h+='<div class="who"><b>Devotions:</b> '+esc(devoWho(s,M)||"Not set yet")+'</div>';
  if(!full&&!off&&k==="sun"){const w=(M.suns||[]).find(x=>x.d===s);if(w&&(w.list||[]).length)h+=fold("mus-"+s,"Music",musicHtml(w.list,"",null,s));h+=planHtml(s,w)+wordsHtml(s,w)}
  return h+awayHtml(m,i)+visHtml(s)+'</article>'}
// a section that opens and closes; stays as the member left it until the app is closed (never saved)
const openFolds=new Set();
function fold(k,title,body,sub){return '<details class="fold" data-fold="'+esc(k)+'"'+(openFolds.has(k)?' open':'')+'><summary>'+(sub?'<span>'+esc(title)+'<span class="upd">'+esc(sub)+'</span></span>':esc(title))+'</summary><div class="fb">'+body+'</div></details>'}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold){if(d.open)openFolds.add(d.dataset.fold);else openFolds.delete(d.dataset.fold)}},true);
// wh = the words as HTML, already cleaned by builder/data.js to paragraphs, line breaks, bold and italic (w = plain text)
function wordsHtml(s,w){if(D.words)return "";return w&&w.wh?fold("bmw-"+s,"Band Message Words",'<div class="bmw h">'+w.wh+'</div>'):w&&w.w?fold("bmw-"+s,"Band Message Words",'<div class="bmw">'+esc(w.w)+'</div>'):""}
// This week's music for a date (M = D.music, or D.past for a past date): the practice list and devotions,
// or the Sunday's music, Meeting Plan and Band Message Words
function fullMusicHtml(s,M,none,past){
  if(kind(s)==="ev")return '<div class="sec">Music</div>'+musicHtml((xOf(s)||{}).list||[],none,null,s);
  if(kind(s)==="wed"){const w=(M.weds||[]).find(x=>x.d===s),reh=(w&&w.reh)||[],dv=reh.find(r=>r.devo),sun=P(s);sun.setDate(sun.getDate()+4);
    return (dv?'<div class="who"><b>Devotions:</b> '+esc(dv.i||"Not set yet")+'</div>':'')+'<div class="sec">Music</div>'+musicHtml(reh.filter(r=>!r.devo),none,past?iso(sun):null,s)}
  const w=(M.suns||[]).find(x=>x.d===s);return '<div class="sec">Music</div>'+musicHtml((w&&w.list)||[],none,null,s)+planHtml(s,w)+wordsHtml(s,w)}
// A past band date (D.past, the last 8 weeks), picked in the calendar: shown like This week, but read-only
const PST={in:"You were In",away:"You were away",usual:"Not usually on "};
function pastCardHtml(m,s){const PD=D.past||{},j=(PD.sessions||[]).indexOf(s),off=offOf(s),c=(m.pcells||[])[j];
  const st=["x","p"].includes(c)?"away":c==="s"?"usual":"in",away=["x","p","s"].includes(c)?["You"]:[];
  D.members.forEach(x=>{if(x.id!==m.id&&!x.test&&["x","p","s"].includes((x.pcells||[])[j]))away.push(shortName(x.name))});
  return '<article class="dc past'+(kind(s)==="ev"?' evc':'')+'" data-s="'+s+'"><div class="dh"><span class="dd">'+fmt(s,true)+'</span>'+(off?'':'<span class="dk">'+kindLabel(s)+'</span>')+evHtml(s)+'<span class="ptag">Past</span></div>'
   +(off?'<div class="offst">'+esc(off.l)+(off.n?'<small>'+esc(off.n)+'</small>':'')+'</div>'
     :'<div class="st '+st+'">'+ICON[st]+'<span>'+esc(PST[st]+(st==="usual"?(kind(s)==="sun"?"Sundays":"Wednesdays"):""))+'</span></div>'+fullMusicHtml(s,PD,"No music shown for this date",true)
      +'<div class="who"><b>Away:</b> '+(away.length?esc(away.join(", ")):"Nobody")+'</div>')
   +visHtml(s)+'</article>'}
function visHtml(s){const v=(D.visitors||{})[s]||[];
  return v.length?'<div class="vis"><div class="sec">Visiting players</div><ul>'+v.map(x=>'<li><b>'+esc(x.n)+'</b>'+(x.p?' <span class="muted">'+esc(x.p)+'</span>':'')+'</li>').join("")+'</ul></div>':''}

// ----- views -----
function renderWeek(){const m=me();recs=[];
  setTop();
  if(!m){$("week").innerHTML="";return}
  const up=upcoming(),wi=up.find(i=>kind(D.sessions[i])==="wed"),si=up.find(i=>kind(D.sessions[i])==="sun");
  // and any extra events up to the later of those two days (or the coming 7 days when there is neither)
  const last=[wi,si].filter(i=>i!=null).map(i=>D.sessions[i].slice(0,10)).sort().pop()||iso(new Date(Date.now()+6*86400000));
  const xs=up.filter(i=>kind(D.sessions[i])==="ev"&&D.sessions[i].slice(0,10)<=last);
  $("week").innerHTML=[wi,si,...xs].filter(i=>i!=null).sort((a,b)=>a-b).map(i=>cardHtml(m,i,true)).join("")||'<p class="muted">No band dates coming up.</p>'}
function renderDates(){const m=me(),area=$("myarea");
  for(const b of document.querySelectorAll("[data-view]"))b.setAttribute("aria-pressed",String(b.dataset.view===dview));
  const dva=$("devoArea");if(!m){area.innerHTML="";if(dva)dva.innerHTML="";return}
  const up=upcoming(),banner="";if(dva)dva.innerHTML=devoBanner(m);
  if(dview==="cal"){area.innerHTML=banner+calHtml(m,up);return}
  // 10 dates, then 10 more with each tap of Show more dates, up to the 12 months the app has
  const list=up.slice(0,shown);let h="",mon=null;
  for(const i of list){const s=D.sessions[i],mm=P(s).getMonth();if(mm!==mon){mon=mm;h+='<div class="month">'+MONL[mm]+'</div>'}h+=cardHtml(m,i,false)}
  if(up.length>list.length)h+='<button type="button" class="btn wide" id="moreBtn">Show more dates, to '+fmt(D.sessions[up[Math.min(up.length,shown+10)-1]],true)+'</button>';
  area.innerHTML=banner+(h||'<p class="muted">No band dates coming up.</p>')}

// Every note asks for Noted (ack only adds one reminder), and can offer answers to tap (rs.k "one" or "many") or take a written reply (rs.k "text").

function myReply(n){const r=(D.myReplies||{})[n.id],l=store.get("band.replies",{})[n.id];return l&&(!r||String(l.at)>String(r.at))?l:(r||null)}

     :'<div class="ropts">'+(n.rs.o||[]).map((o,i)=>'<button type="button" class="ropt" data-ropt="'+i+'" aria-pressed="'+sel.c.includes(i)+'">'+esc(o)+'</button>').join("")+'</div>')
   +'<p class="sub">Only the Bandmaster sees your reply.</p><button type="button" class="btn navy" data-rsend="'+esc(n.id)+'"'+(ready?'':' disabled')+'>Send reply</button></div>'}
function noteHtml(n,btn){const r=n.rs?myReply(n):null;
  let h='<div class="msg'+(btn?'':' read')+'"><span class="from">'+(n.devo?'Just for you · Devotions':n.fp&&btn?'Just for you · Your part':n.to?'Just for you':btn?'From the Bandmaster':'Read')+(n.date?' · '+esc(fmt(n.date,true)):'')+'</span><div class="nt">'+(n.fp?esc(n.fp.l)+'<br><b class="fpp">'+esc(n.fp.p)+'</b>':linky(n.text))+'</div>';
  if(r)h+='<div class="mine"><b>Your reply</b> · '+esc(whenText(new Date(r.at)))+'<div>'+esc(replyText(n,r))+'</div><small>Sent for Bandmaster</small></div>';
  if(btn){if(n.rs&&!n.cl&&!r)h+=replyForm(n)+'<p class="orline">or</p>';
    h+=(n.devo&&n.ack&&!n.cl?'<div class="ask">Please tap Noted so the Devotions Coordinator knows you\'ve seen it.</div>':'')+'<button type="button" class="btn brass" data-noted="'+esc(n.id)+'">Noted</button>'}

async function sendReply(n,b){const m=me(),sel=rsel[n.id];if(!m||!sel)return;

    if(r&&r.ok){const L=store.get("band.replies",{});L[n.id]=r.reply;store.set("band.replies",L);delete rsel[n.id];markNoted(n);showMsg("Reply sent","The Bandmaster will see it.");return}
    showMsg("Not sent",r&&r.error==="closed"?"Replies to this note have closed.":"That didn't send. Try again."+(r&&r.error?" ("+r.error+")":""))}
  catch(e){showMsg("Not sent",navigator.onLine===false?"Check your internet connection, then try again.":"That didn't send ("+String(e&&e.message||e)+"). Try again.")}
  renderNotes()}

// Noted taps are kept on this phone AND sent to the Bandmaster's record, so a note read on one device is read on all of them.

// ----- sending (one confirm, 5 second Undo, then off to the Bandmaster) -----
const UNDO_MS=5000;
const gsr=()=>window.__bandGsr||((typeof google!=="undefined"&&google.script&&google.script.run&&typeof google.script.run.sendFromPage==="function")?google.script.run:null);
function cmdFor(m,s,want,reason){const i=D.sessions.indexOf(s),c=m.cells[i];
  // an extra event: its day and its id after the date, "Thu 17/12/2026 #e7k2p" (the Apps Script reads it as the event)
  const au=(kind(s)==="ev"?DOW[P(s).getDay()]+" ":kind(s)==="sun"?"Sun ":"Wed ")+s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4)+(kind(s)==="ev"?" #"+s.slice(11):"");
  if(want==="away")return ["r","x","s"].includes(c)?au+" UNDO AVAILABLE":au+(reason?" ("+reason.replace(/[();]/g,"")+")":"");
  return ["","p"].includes(c)?au+" CANCEL":au+" AVAILABLE"}
let qTimer=null,tickTimer=null,toastMsg=null;
function saveQ(){store.set("band2.queue",queue)}
function enqueue(m,items,note){if(!gsr()){showMsg("Sending isn't available on this page","Open the band app to change your dates.");return}
  if(queue)flush();
  queue={mid:m.id,items,note:note||"",at:Date.now()};saveQ();toastMsg=null;
  clearTimeout(qTimer);qTimer=setTimeout(flush,UNDO_MS);
  renderAll()}
function undo(){if(!queue)return;clearTimeout(qTimer);queue=null;saveQ();renderAll()}
function flush(){clearTimeout(qTimer);if(!queue)return;const q=queue,m=D.members.find(x=>x.id===q.mid),g=gsr();
  if(!m||!g){queue=null;saveQ();renderAll();return}
  const txt=q.items.map(x=>cmdFor(m,x.date,x.want,x.reason)).join("; ");
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  // show it as sent straight away; only roll back if the send fails
  const im=intents[m.id]=intents[m.id]||{};q.items.forEach(x=>{const i=D.sessions.indexOf(x.date);im[x.date]={want:x.want,at:Date.now(),base:m.cells[i]}});
  store.set("band2.intents",intents);queue=null;saveQ();renderAll();
  g.withSuccessHandler(()=>{}).withFailureHandler(()=>{q.items.forEach(x=>{delete (intents[m.id]||{})[x.date]});store.set("band2.intents",intents);
    queue=Object.assign({},q,{failed:true});saveQ();showMsg("Not sent","Check your internet connection, then tap Try again.",true)}).sendFromPage(m.formName,txt,id,q.note||"",m.id)}
function retry(){if(!queue)return;queue.failed=false;queue.at=Date.now()-UNDO_MS;toastMsg=null;flush()}
function showMsg(t,sub,canRetry){toastMsg={t,sub,retry:!!canRetry};renderToast();if(!canRetry){clearTimeout(showMsg._t);showMsg._t=setTimeout(()=>{toastMsg=null;renderToast()},4000)}}
function renderToast(){const el=$("toast");clearInterval(tickTimer);
  if(toastMsg){el.innerHTML='<span class="ttxt">'+esc(toastMsg.t)+(toastMsg.sub?'<small>'+esc(toastMsg.sub)+'</small>':'')+'</span>'+(toastMsg.retry?'<button type="button" data-retry>Try again</button>':'');el.hidden=false;return}
  if(!queue||queue.failed){el.hidden=true;el.innerHTML="";return}
  const left=()=>Math.max(1,Math.ceil((UNDO_MS-(Date.now()-queue.at))/1000)),el0=Math.min(UNDO_MS,Date.now()-queue.at);

  el.hidden=false;tickTimer=setInterval(()=>{if(!queue){clearInterval(tickTimer);return}const t=$("tnum");if(t)t.textContent=left()},250)}

// ----- header -----
function whenText(t){if(isNaN(t))return "";const h=t.getHours(),mi=String(t.getMinutes()).padStart(2,"0");const tm=((h%12)||12)+":"+mi+(h<12?"am":"pm");
  return t.toDateString()===new Date().toDateString()?tm:DOW[t.getDay()]+" "+t.getDate()+" "+MON[t.getMonth()]+" "+tm}
function isStale(){const st=window.__bandStatus;return !!(st&&st.checked&&!st.checking&&Date.now()-st.checked>3600000)}
// the header: "Hi Alex" big once a name is chosen, with the band name and the update time on the small line
function setTop(){const el=$("tbupd"),m=me();
  const nm=m?m.name.split(" ").filter(Boolean):[];   // "Sam T." leaves room for the rest of the line
  el.textContent=(nm.length?nm[0]+(nm.length>1?" "+nm[nm.length-1][0]:"")+" · ":"")+"Wollongong Salvos Band App · "+updText();el.classList.toggle("stale",isStale())}
function updText(){const v=window.__bandAppVer?"v"+window.__bandAppVer+" · ":"";const st=window.__bandStatus;
  if(st&&st.checking)return v+"Checking…";
  if(st&&st.checked&&isStale())return v+"Not updated since "+whenText(new Date(st.checked));
  if(st&&st.checked)return v+(st.offline?"Offline · ":"Updated ")+whenText(new Date(st.checked));
  const t=new Date(D.updatedAt||"");return v+(isNaN(t)?(D.updated?"Updated "+D.updated:""):"Updated "+whenText(t))}
(function renderTop(){setTop();setInterval(setTop,60000)})();
function refreshNow(){if(window.__bandRefresh){const u=$("updNow"),b=$("refreshNow");if(u)u.textContent="Checking for updates…";if(b){b.disabled=true;setTimeout(()=>{b.disabled=false},30000)}window.__bandRefresh()}else if(onAppsScript){window.top.location.href=D.form.quick}else location.reload()}

if(queue&&!queue.failed)setTimeout(flush,800);   // left over from last time the app was open
// one-off: send notes this phone already marked Noted before the Bandmaster's record existed
if(me()&&!store.get("band.notedSynced",false)){const seen=store.get("band.noted",{}),q=store.get("band.notedQ",[]);
  (D.notes||[]).forEach(n=>{if(seen[n.id]===n.v&&!q.some(y=>y.id===n.id))q.push({m:who,id:n.id,v:n.v})});store.set("band.notedQ",q);store.set("band.notedSynced",true)}
setTimeout(flushNoted,1200);loadNotedFor();
renderAll();
window.__bandSafe=()=>!queue&&$("sheet").hidden&&$("pick").hidden;
window.__bandToast=(t,sub)=>showMsg(t,sub);
window.__bandRerender=function(){mergeX();setTop();if(!D.members.some(m=>m.id===who)){who="";$("pick").hidden=false}tidy();renderAll();setUpd()};
// Settings > Check for Updates: show the result on the page itself when a check finishes
function setUpd(){const u=$("updNow"),b=$("refreshNow"),st=window.__bandStatus||{};if(!u||st.checking)return;u.textContent=updText().replace(/^v[\d.]+ · /,"");if(b)b.disabled=false}
})();
};</script>
<script>
(function(){
"use strict";
var API="https://script.google.com/macros/s/AKfycbyicvqPU2m1jZ4yLrbjZCFO2o-fEr2UdV1A44Wgd8dOGOhgwjMjfH__ndfWq8qbjNDX/exec",KK="band.k",KD="band.data";
window.__bandAppVer="6.5";
var st={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var $=function(id){return document.getElementById(id)};
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function call(p){var q=Object.keys(p).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(p[k])}).join("&");
  return fetch(API+"?"+q,{redirect:"follow",cache:"no-store",keepalive:p.api==="send"||p.api==="noted"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
// sending from the page goes through the same API, shaped like google.script.run
function mk(ok,fail){return{withSuccessHandler:function(f){return mk(f,fail)},withFailureHandler:function(f){return mk(ok,f)},
  sendFromPage:function(n,d,id,note,mid){call({api:"send",k:st.get(KK)||"",n:n,d:d,id:id,note:note||"",m:mid||""}).then(function(r){
    if(r&&r.ok){ok&&ok({title:r.title,body:r.body});setTimeout(check,1500)}else{fail&&fail(new Error((r&&r.error)||"failed"))}}).catch(function(e){fail&&fail(e)})},
  notedFromPage:function(m,nid,v){call({api:"noted",k:st.get(KK)||"",m:m,nid:nid,v:v}).then(function(r){
    if(r&&r.ok){ok&&ok(r)}else{fail&&fail(new Error((r&&r.error)||"failed"))}}).catch(function(e){fail&&fail(e)})}}}
window.__bandGsr=mk(null,null);
// role functions (Devotions Coordinator) call the API directly
window.__bandApi=function(p){p.k=st.get(KK)||"";return call(p)};
var booted=false;
function boot(d){window.__BAND_DATA__=d;$("gate").hidden=true;if(!booted){booted=true;window.__bandBoot();setTimeout(installHint,1500);updatedToast();setTimeout(function(){verCheck(true)},2500);setTimeout(function(){if(window.__bandPush)window.__bandPush.resync()},4000)}}
function gate(title,msg,form,err,retry){$("gate").hidden=false;$("gInst").hidden=true;$("gTitle").textContent=title;$("gMsg").textContent=msg;$("gForm").hidden=!form;$("gErr").textContent=err||"";$("gRetry").hidden=!retry;if(form)setTimeout(function(){$("gPw").focus()},50)}
// On an iPhone in Safari, show how to add the app to the Home Screen BEFORE the password: the Home Screen app keeps
// its own storage, so a password entered in Safari would have to be entered again there.
var instSkip=false;
function askPw(err){if(!err&&!instSkip&&iosBrowser()){instGate();return}
  gate("Band password",standalone?"You're in the band app. Enter the band password once and it will be remembered here.":"Enter the band password once. This phone will remember it.",true,err,false)}
function instGate(){gate("First, put the band app on your Home Screen","Do this before you enter the band password. Then you only sign in once, and the app remembers you.",false,"",false);
  var b=$("gInst");b.innerHTML=instSteps(true)+'<p class="ibar">Safari\'s buttons are in the bar at the bottom of the screen &#8595;</p><button type="button" class="lnk" id="iSkip">Skip this and sign in here instead</button>';b.hidden=false;
  $("iSkip").addEventListener("click",function(){instSkip=true;askPw("")})}
// Open straight away with the copy saved on this phone, then check for updates in the background.
var KT="band.checked";
function status(o){window.__bandStatus=o;if(booted&&window.__bandRerender){try{$("tbupd").textContent=""}catch(e){}window.__bandRerender()}}
function apply(d){var D=window.__BAND_DATA__;if(!D){boot(d);return}Object.keys(D).forEach(function(x){delete D[x]});Object.assign(D,d)}
var busy=false;
function check(){if(busy)return;busy=true;var k=st.get(KK)||"";var first=!booted;
  if(first)gate("Opening…","Getting the latest band details. The first time can take up to 30 seconds.",false,"",false);
  else status({checking:true,checked:+st.get(KT)||0});
  call({api:"data",k:k,m:whoNow()}).then(function(r){
    if(r&&r.ok){var t=Date.now();st.set(KD,JSON.stringify(r.data));st.set(KT,String(t));
      if(first){window.__bandStatus={checked:t};boot(r.data)}else{apply(r.data);status({checked:t})}return}
    if(r&&r.error==="password"){st.del(KK);st.del(KD);if(booted){location.reload();return}askPw(k?"The password has changed. Please enter the new one.":"");return}
    throw new Error((r&&r.error)||"unavailable")
  }).catch(function(){
    if(booted){status({checked:+st.get(KT)||0,offline:true});return}
    gate("Can't connect","The band page couldn't be reached. Check your connection and try again.",false,"",true)
  }).then(function(){busy=false})}
function start(){
  var c=st.get(KD);
  if(c&&st.get(KK)!==null){try{window.__bandStatus={checking:true};boot(JSON.parse(c))}catch(e){}}
  check()}
window.__bandRefresh=check;
// Pull down from the top of the page to refresh, like other phone apps.
(function(){var el=$("ptr"),y0=null,dy=0,PULL=70;
  function blocked(){return !booted||!$("gate").hidden||!$("pick").hidden||!$("sheet").hidden||(window.scrollY||document.documentElement.scrollTop)>0}
  function show(d){var r=Math.min(d,PULL*1.4);el.classList.remove("anim");el.style.opacity=String(Math.min(1,r/PULL));el.style.transform="translate(-50%,"+(r-60)+"px)";
    var ok=d>=PULL;el.classList.toggle("ready",ok);el.querySelector("span").textContent=ok?"Release to refresh":"Pull to refresh"}
  function hide(){el.classList.add("anim");el.classList.remove("ready","spin");el.style.opacity="0";el.style.transform="translate(-50%,-80px)"}
  document.addEventListener("touchstart",function(e){if(e.touches.length!==1||blocked()){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  document.addEventListener("touchmove",function(e){if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0||(window.scrollY||document.documentElement.scrollTop)>0){dy=0;hide();return}show(dy)},{passive:true});
  document.addEventListener("touchend",function(){if(y0===null)return;y0=null;
    if(dy>=PULL){el.classList.add("anim","spin");el.classList.remove("ready");el.style.opacity="1";el.style.transform="translate(-50%,10px)";el.querySelector("span").textContent="Checking for updates…";el.querySelector("i").innerHTML="&#8635;";
      check();var w=setInterval(function(){if(!busy){clearInterval(w);el.querySelector("i").innerHTML="&#8595;";hide()}},300)}
    else hide();dy=0},{passive:true});
})();
// Keep the data fresh without anyone tapping Refresh: when the app comes back on screen, and every 5 minutes while it is open.
function due(ms){return Date.now()-(+st.get(KT)||0)>ms}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&booted){if(due(20000))check();verCheck()}});
window.addEventListener("focus",function(){if(booted&&due(20000))check()});
setInterval(function(){if(document.visibilityState!=="visible"||!booted)return;if(due(240000))check();verCheck()},300000);
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",function(e){if(e.data==="refresh"&&booted)check()});

// ----- app updates: check version.json, update by itself when it's safe, else show the Update now bar -----
var KU="band.updatedTo",KUA="band.updAttempt",verBusy=false,verAt=0;
function safeNow(){return !window.__bandSafe||window.__bandSafe()}
function doUpdate(v){var a=st.get(KUA)||"";var now=Date.now();
  if(a.split("|")[0]===v&&now-(+a.split("|")[1]||0)<600000){$("updbar").hidden=false;return}   // tried in the last 10 minutes, let them tap
  st.set(KUA,v+"|"+now);st.set(KU,v);
  var go=function(){location.reload()};
  var sw=("serviceWorker" in navigator)?navigator.serviceWorker.getRegistration().then(function(r){return r&&r.update()}).catch(function(){}):Promise.resolve();
  Promise.all([sw,fetch("./?v="+encodeURIComponent(v),{cache:"reload"}).catch(function(){})]).then(go,go)}
function verCheck(force){if(verBusy||(!force&&Date.now()-verAt<60000))return;verBusy=true;verAt=Date.now();
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){verBusy=false;
    if(!j||!j.v||j.v===window.__bandAppVer){$("updbar").hidden=true;return}
    if(safeNow())doUpdate(j.v);else $("updbar").hidden=false}).catch(function(){verBusy=false})}
$("updGo").addEventListener("click",function(){$("updGo").disabled=true;$("updGo").textContent="Updating…";st.del(KUA);
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){doUpdate(j.v||"")},function(){location.reload()})});
function updatedToast(){if(st.get(KU)===window.__bandAppVer){st.del(KU);st.del(KUA);setTimeout(function(){if(window.__bandToast)window.__bandToast("App updated to version "+window.__bandAppVer)},600)}}

// ----- alerts (web push straight from the band's Apps Script) -----
var KP="band.push";
function b64ToU8(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="===".slice((s.length+3)%4);var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function whoNow(){try{return JSON.parse(localStorage.getItem("band.who")||'""')||""}catch(e){return ""}}
function pushPrefs(){try{return JSON.parse(st.get(KP)||"null")}catch(e){return null}}
function reg(){return navigator.serviceWorker.ready}
function sendSub(sub,prefs){var j=sub.toJSON();var on=Object.keys(prefs).filter(function(k){return prefs[k]}).join(",");
  return call({api:"sub",k:st.get(KK)||"",m:whoNow(),ep:j.endpoint,p:j.keys.p256dh,a:j.keys.auth,prefs:on,test:"1"}).then(function(r){if(!r||!r.ok)throw new Error((r&&r.error)||"failed")})}
window.__bandPush={
  state:function(){var ok="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(!ok)return Promise.resolve({reason:ios&&!standalone?"install":"unsupported"});
    if(Notification.permission==="denied")return Promise.resolve({reason:"denied"});
    return reg().then(function(r){return r.pushManager.getSubscription()}).then(function(sub){var p=pushPrefs();return {on:!!(sub&&p),prefs:p||{notes:true,music:true,noted:true}}})},
  enable:function(prefs){return Notification.requestPermission().then(function(perm){if(perm!=="granted")throw new Error("denied");
      var key=(window.__BAND_DATA__||{}).vapid;if(!key)throw new Error("no key");
      return reg().then(function(r){return r.pushManager.getSubscription().then(function(s){return s||r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(key)})})})})
    .then(function(sub){return sendSub(sub,prefs).then(function(){st.set(KP,JSON.stringify(prefs))})})},
  setPrefs:function(prefs){return reg().then(function(r){return r.pushManager.getSubscription()}).then(function(sub){if(!sub)throw new Error("off");
    var j=sub.toJSON(),on=Object.keys(prefs).filter(function(k){return prefs[k]}).join(",");
    return call({api:"sub",k:st.get(KK)||"",m:whoNow(),ep:j.endpoint,p:j.keys.p256dh,a:j.keys.auth,prefs:on}).then(function(r){if(!r||!r.ok)throw new Error("failed");st.set(KP,JSON.stringify(prefs))})})},
  disable:function(){st.del(KP);if(!("serviceWorker" in navigator))return Promise.resolve();
    return reg().then(function(r){return r.pushManager.getSubscription()}).then(function(sub){if(!sub)return;var ep=sub.toJSON().endpoint;
      return call({api:"unsub",k:st.get(KK)||"",ep:ep}).catch(function(){}).then(function(){return sub.unsubscribe()})})},
  resync:function(){var p=pushPrefs();if(!p||!("serviceWorker" in navigator))return;reg().then(function(r){return r.pushManager.getSubscription()}).then(function(sub){if(sub)return window.__bandPush.setPrefs(p)}).catch(function(){})}
};
$("gRetry").addEventListener("click",check);
$("gForm").addEventListener("submit",function(ev){ev.preventDefault();var pw=$("gPw").value.trim();if(!pw)return;
  $("gGo").disabled=true;$("gErr").textContent="Checking…";
  sha(pw).then(function(h){return call({api:"data",k:h}).then(function(r){
    if(r&&r.ok){var t=Date.now();st.set(KK,h);st.set(KD,JSON.stringify(r.data));st.set(KT,String(t));$("gPw").value="";window.__bandStatus={checked:t};boot(r.data);return}
    $("gErr").textContent=(r&&r.error==="password")?"That password is not right. Try again.":"Something went wrong. Try again."})})
  .catch(function(){$("gErr").textContent="Couldn't connect. Check your connection and try again."})
  .then(function(){$("gGo").disabled=false})});
// tip on how to add the app to the home screen (also shown from Settings > Use as an app)
var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
var deferred=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e});
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function iosBrowser(){return !standalone&&isIOS()}
var IC_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg>';
var IC_MORE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
function instSteps(first){return '<ol class="isteps"><li><span>Tap the Share button <span class="ik">'+IC_SHARE+'Share</span> in Safari. If you can\'t see it, tap <span class="ik" aria-label="More">'+IC_MORE+'</span> first.</span></li>'
  +'<li><span>Scroll down and tap <span class="ik">Add to Home Screen</span></span></li>'
  +'<li><span>Tap <span class="ik">Add</span>'+(first?', then close Safari':'')+'</span></li>'
  +'<li><span>Open <span class="ik"><img src="icon-180.png" alt="">Salvo Band</span> on your Home Screen'+(first?' and enter the band password there':'')+'</span></li></ol>'}
function installHint(force){if(standalone||window.__bandPC)return;if(!force&&st.get("band.instDone"))return;
  var later=+st.get("band.instLater")||0;if(!force&&Date.now()-later<3*86400000)return;
  var box=$("inst");
  if(deferred)box.innerHTML='<p><b>Install the band app</b><br>Adds the band page to your home screen.</p><div class="row"><button class="btn" id="iNo">Not now</button><button class="btn send" id="iGo">Install</button></div>';
  else if(isIOS())box.innerHTML='<p><b>Put the band app on your Home Screen</b><br>It opens like a normal app and can send you alerts. You\'ll enter the band password once more in the new app.</p>'+instSteps(false)+'<div class="row"><button class="btn" id="iLater">Remind me later</button><button class="btn navy" id="iNo">I\'ve done it</button></div>';
  else return;
  box.hidden=false;
  $("iNo").addEventListener("click",function(){st.set("band.instDone","1");box.hidden=true});
  var l=$("iLater");if(l)l.addEventListener("click",function(){st.set("band.instLater",String(Date.now()));box.hidden=true});
  var g=$("iGo");if(g)g.addEventListener("click",function(){deferred.prompt();deferred.userChoice.then(function(){st.set("band.instDone","1");box.hidden=true})})}
window.__bandInstall={need:function(){return !standalone&&!window.__bandPC&&(isIOS()||!!deferred)},show:function(){installHint(true)}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
start();
})();
</script>
</body>
</html>
